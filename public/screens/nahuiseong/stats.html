<p class="font-body-md text-on-surface-variant">최근 24시간 동안의 섭취 분석 결과입니다.</p>
</section>

</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">

</div>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">복용 꾸준함 점수</h3>

</div>
</div>
<!-- Focus Item Card -->

<div>

</div>
</div>
</div>

<span class="font-label-sm text-label-sm">통계</span>

<script>
        // Simple micro-interaction for cards
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-2px)';
                card.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0)';
            });
        });
    </script>
