<!-- Overlay Micro-Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ripple-like effect for the register button
            const registerBtn = document.querySelector('footer button');
            registerBtn.addEventListener('click', (e) => {
                const rect = registerBtn.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('span');
                ripple.style.position = 'absolute';
                ripple.style.width = '10px';
                ripple.style.height = '10px';
                ripple.style.background = 'rgba(255,255,255,0.3)';
                ripple.style.borderRadius = '50%';
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.style.transform = 'translate(-50%, -50%)';
                ripple.style.animation = 'ripple 0.6s linear';
                
                registerBtn.style.overflow = 'hidden';
                registerBtn.style.position = 'relative';
                registerBtn.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Add CSS keyframes for the ripple effect
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes ripple {
                to {
                    width: 400px;
                    height: 400px;
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
